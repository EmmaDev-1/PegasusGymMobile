name: pegasus_gym_mx
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  riverpod: ^2.6.1
  flutter_dotenv: ^5.1.0
  http: ^0.13.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  cached_network_image: ^3.3.1
  sizer: ^3.0.5
  flutter_native_splash: ^2.4.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/logo_pegasus_gym.png
    - assets/images/facebook_logo.png
    - assets/images/gmail_logo.png
    - assets/images/x_logo.png
    - assets/images/google_logo.jpg
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

flutter_native_splash:
  color: "#ffffff" # o el color que desees para el fondo
  image: assets/images/logo_pegasus_gym.png
  android: true
  ios: true
